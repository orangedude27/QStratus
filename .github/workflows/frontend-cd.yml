name: Frontend CD
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  BLOG_DOCS_ROOT: .vercel-blog-docs

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docs/**"
      - "deploy/**"
      - ".github/workflows/frontend-cd.yml"

# Self-hosted runner setup:
#   1. Install the GitHub Actions runner on your Linux server.
#   2. Place your real env files at $DEPLOY_ENV_DIR (repo variable, defaults to ~/qstratus-env).
#      Expected files: frontend.env
#   3. Ensure the runner user has access to Docker.

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable and prepare pnpm
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Verify pnpm installation
        run: |
          pnpm --version
          which pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage blog docs for Vercel
        run: |
          mkdir -p "$BLOG_DOCS_ROOT"
          cp -R ../docs/. "$BLOG_DOCS_ROOT"/
          test -d "$BLOG_DOCS_ROOT"

      - name: Pull Vercel environment info
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build project artifacts
        run: pnpm dlx vercel@latest build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-selfhost:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy env files from server
        run: |
          ENV_DIR="${{ vars.DEPLOY_ENV_DIR || '~/qstratus-env' }}"
          mkdir -p deploy/env
          cp "${ENV_DIR}/frontend.env" deploy/env/frontend.env

      - name: Rebuild and restart frontend
        run: |
          docker compose -f deploy/docker-compose.selfhost.yml \
            up -d --build --no-deps frontend

      - name: Clean up old images
        run: docker image prune -f
