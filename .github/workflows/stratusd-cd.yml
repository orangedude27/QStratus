name: stratusd CD

on:
  push:
    branches:
      - main
    paths:
      - "stratusd/**"
      - "deploy/**"
      - ".github/workflows/stratusd-cd.yml"

# Self-hosted runner setup:
#   1. Install the GitHub Actions runner on your Linux server.
#   2. Place your real env files at $DEPLOY_ENV_DIR (repo variable, defaults to ~/qstratus-env).
#      Expected files: stratusd.env
#   3. Ensure the runner user has access to Docker and /dev/dri, /dev/uinput.

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy env files from server
        run: |
          ENV_DIR="${{ vars.DEPLOY_ENV_DIR || '~/qstratus-env' }}"
          mkdir -p deploy/env
          cp "${ENV_DIR}/stratusd.env" deploy/env/stratusd.env

      - name: Rebuild and restart stratusd
        run: |
          docker compose -f deploy/docker-compose.selfhost.yml \
            up -d --build --no-deps stratusd

      - name: Clean up old images
        run: docker image prune -f
