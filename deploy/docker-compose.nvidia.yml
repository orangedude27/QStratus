# NVIDIA GPU override for docker-compose.selfhost.yml
# Apply with: docker compose -f docker-compose.selfhost.yml -f docker-compose.nvidia.yml up -d
#
# This replaces the privileged: true mode with NVIDIA Container Toolkit runtime.
# More secure: only exposes GPU devices without full host access.
#
# Prerequisites:
#   1. NVIDIA drivers installed on host
#   2. NVIDIA Container Toolkit installed and configured
#   3. Docker restarted after toolkit installation
#
# Verify toolkit: docker run --rm --gpus all nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi

services:
  stratusd:
    # Remove privileged mode — NVIDIA runtime handles GPU access
    privileged: false

    # Use NVIDIA runtime for GPU access
    # This replaces privileged: true with scoped GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use '1' for single GPU, 'all' for multi-GPU
              capabilities: [gpu]

    # Keep uinput for controller input (not covered by NVIDIA runtime)
    devices:
      - /dev/uinput:/dev/uinput

    # /dev/dri is still needed for some VAAPI interoperability
    # NVIDIA Container Toolkit also exposes /dev/nvidia* automatically
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
