services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./env/backend.env
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ./env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  stratusd:
    build:
      context: ../stratusd
      dockerfile: Dockerfile
    env_file:
      - ./env/stratusd.env
    # Host networking keeps QUIC/WebTransport UDP behavior simple.
    network_mode: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
    volumes:
      - ../games/build:/games:ro
      - steam_data:/data/steam
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f stratusd || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  steamcmd:
    build:
      context: ../deploy/steamcmd
      dockerfile: Dockerfile
    environment:
      - STEAM_USER=${STEAM_USER:-}
      - STEAM_PASSWORD=${STEAM_PASSWORD:-}
      - GAMES=${STEAMCMD_GAMES:-[]}
    volumes:
      - steam_data:/data/steam
    restart: "no"
    profiles:
      - steam

volumes:
  backend_data:
  steam_data:
