services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./env/backend.env
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/storage

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ./env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  stratusd:
    build:
      context: ../stratusd
      dockerfile: Dockerfile
    env_file:
      - ./env/stratusd.env
    # Host networking keeps QUIC/WebTransport UDP behavior simple.
    network_mode: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
    volumes:
      - ../games/build:/games:ro
      - steam_data:/data/steam
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix

  steamcmd:
    build:
      context: ../deploy/steamcmd
      dockerfile: Dockerfile
    environment:
      - STEAM_USER=${STEAM_USER:-}
      - STEAM_PASSWORD=${STEAM_PASSWORD:-}
      - GAMES=${STEAMCMD_GAMES:-[]}
    volumes:
      - steam_data:/data/steam
    restart: "no"
    profiles:
      - steam

volumes:
  backend_data:
  steam_data:
